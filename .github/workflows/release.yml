name: release

# Releases this fork. Start it from the Actions tab (phone works too) with a version
# number: slot's own version plus a fourth number for this fork, as in 1.16.0.1, then
# 1.16.0.2, and 1.16.1.1 once slot 1.16.1 is merged in. A device running an earlier
# release of this fork offers the new one under System -> Check for Updates.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in 1.16.0.1 (no leading v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version is new
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Refuse a version a device would not take as newer
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+(\.[0-9]+){2,3}'; then
            echo "::error::$VERSION is not numbers with dots, as in 1.16.0.1: a device would never offer it"
            exit 1
          fi
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already released"
            exit 1
          fi
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$last" ]; then
            top=$(printf '%s\n%s\n' "${last#v}" "$VERSION" | sort -V | tail -n1)
            if [ "$top" != "$VERSION" ] || [ "${last#v}" = "$VERSION" ]; then
              echo "::error::$VERSION is not newer than the latest release $last, so no device would offer it"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: PICO-8 tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - uses: Swatinem/rust-cache@v2

      # Only what this fork adds: slot itself is tested upstream before it is released.
      - name: Test PICO-8 and the fork's updater
        env:
          SLOT_SILENT: '1'
        run: >-
          cargo test --no-fail-fast
          -p slot --test pico8 --test pico8_menu --test pico8_hud --test fake08 --test update
          -p slot-ui --test cart --test board
          -p slot-store --test platform

  build:
    name: card tree
    needs: version
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SLOT_VERSION: ${{ inputs.version }}
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, the 32-bit ARM compiler, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"

      - name: Build the tree
        run: task dist:device OUT="slot-${TAG}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${TAG}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          file "$out/System/gambatte_libretro.so" | grep -q aarch64
          file "$out/System/fake08_libretro.so" | grep -q aarch64
          test -f "$out/System/licenses/fake-08.txt"
          test -x "$out/System/slot"
          file "$out/System/pico8_sdl.so" | grep -q "32-bit.*ARM"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          gambatte_src_sha="$(cat vendor/gambatte-src.sha)"
          test -f "$out/System/licenses/gambatte-${gambatte_src_sha}.tar.gz"
          test -f "$out/System/licenses/gambatte-${gambatte_src_sha}.meta"
          for p in cores/gambatte/*.patch; do
            test -f "$out/System/licenses/gambatte-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${TAG}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: [version, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      ZIP: ${{ needs.build.outputs.zip }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            .github/scripts/versions.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Write the notes and versions.json
        run: |
          set -eu
          for head in "## [${TAG#v}]" "## Unreleased"; do
            awk -v head="$head" '
              index($0, head) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
            [ -s notes.md ] && break
          done
          [ -s notes.md ] || echo "slot with PICO-8, ${TAG}." > notes.md
          OUT=versions.json SLOT_TAG="$TAG" SLOT_ZIP="$ZIP" bash .github/scripts/versions.sh

      # A draft first, so no device sees versions.json before its zip is there.
      - name: Create the release
        run: |
          set -eu
          gh release create "$TAG" "$ZIP" versions.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
